name: 同步上游并构建汉化金手指
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    steps:
      - name: 检出master完整代码
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/TeeKay87/HEN-Cheats-Collection.git
          git fetch upstream master

      - name: Git配置提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 上游最新合并到本地master
        run: git merge upstream/master --no-edit

      # 关键修复：先删除本地旧的chinese-build，再从【刚刚更新完的master】新建chinese-build
      - name: 重建chinese-build分支（从最新master）
        run: |
          git branch -D chinese-build || true
          git checkout -b chinese-build

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行汉化脚本
        run: python3 ./translate_cheats.py

      - name: 提交汉化变更
        run: |
          git add cheats/ hencc-website/
          git commit -m "自动构建：同步上游+汉化 $(date '+%Y-%m-%d %H:%M')" || echo "无变更，跳过提交"

      - name: 推送分支
        run: git push -f origin chinese-build
