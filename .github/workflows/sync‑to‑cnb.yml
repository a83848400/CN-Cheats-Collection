name: Sync mirror to cnb.cool
# 触发条件：推送代码、推送tag标签；也可以网页手动运行
on:
  push:
    branches: [ master, chinese-build ]
    tags: [ '*' ]
  workflow_dispatch:

# 并发控制：同分支/ref新任务自动取消正在执行的旧任务，避免重复镜像推送浪费资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history(all branch & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Mirror push to cnb.cool
        env:
          CNB_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          # cnb.cool https鉴权格式 https://cnb:token@cnb.cool/用户名/仓库.git
          MIRROR_URL="https://cnb:${CNB_TOKEN}@cnb.cool/PS5‑xiexiyu/CN‑Cheats‑Collection.git"
          git remote add cnb_mirror "${MIRROR_URL}"
          # --mirror：完整镜像，推送所有分支、tag；--prune：CNB侧删除GitHub已经删掉的分支
          git push --mirror --prune cnb_mirror
          echo "✅镜像同步完成到 cnb.cool/PS5‑xiexiyu/CN‑Cheats‑Collection"
