name: Sync mirror to cnb.cool
on:
  push:
    branches: [ master, chinese-build ]
    tags: [ '*' ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone full repository for mirror
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --bare https://github.com/${{ github.repository }} repo.git
          cd repo.git
          MIRROR_URL="https://cnb:${{ secrets.CNB_MIRROR_TOKEN }}@cnb.cool/PS5-xiexiyu/CN-Cheats-Collection.git"
          git remote add cnb_mirror "${MIRROR_URL}"
          git push --mirror --prune cnb_mirror
          echo "✅完整全仓库镜像同步完成"
        env:
          CNB_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
