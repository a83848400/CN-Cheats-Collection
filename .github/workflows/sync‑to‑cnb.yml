name: Sync mirror to cnb.cool
on:
  push:
    branches: [ master, chinese-build ]
    tags: [ '*' ]
  workflow_dispatch:
  # 每日 UTC 0点 = 北京时间早上8点，执行一次全量兜底镜像同步
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all remote refs completely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/*:refs/*' --prune

      - name: Mirror push to cnb.cool
        env:
          CNB_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
        run: |
          MIRROR_URL="https://cnb:${CNB_TOKEN}@cnb.cool/PS5-xiexiyu/CN-Cheats-Collection.git"
          git remote remove cnb_mirror 2>/dev/null || true
          git remote add cnb_mirror "${MIRROR_URL}"
          git push --mirror --prune cnb_mirror
          echo "✅镜像同步完成到 cnb.cool/PS5-xiexiyu/CN-Cheats-Collection"
