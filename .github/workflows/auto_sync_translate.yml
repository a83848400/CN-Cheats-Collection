name: 同步上游并翻译(LibreTranslate免费公共服务) -> chinese-build
permissions:
  contents: write
on:
  workflow_dispatch:   # 支持网页手动点击运行
  schedule:
    - cron: '0 0 * * *' # UTC时间0点，北京时间早上8点，每日自动定时运行
jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master分支代码
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install json5 requests

      - name: Git机器人身份配置
        run: |
          git config --global user.name "Cheat-Translate-Bot"
          git config --global user.email "bot@example.org"

      - name: 克隆上游原版金手指仓库
        run: |
          rm -rf upstream_src
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_src

      - name: 准备工作目录，复制脚本与词典
        run: |
          rm -rf work_out
          mkdir work_out
          cp -r ./upstream_src/* ./work_out/
          cp ./auto_translate_cheat.py ./work_out/
          mkdir -p ./work_out/conf
          cp ./custom_dict.json ./work_out/conf/custom_dict.json

      - name: 运行翻译脚本
        env:
          DICT_PATH: "./conf/custom_dict.json"
        run: |
          cd ./work_out
          python auto_translate_cheat.py 2>&1
          echo "Translate job finished, exit code: $?"

      - name: 提交并推送到 chinese-build 分支
        run: |
          cd ./work_out
          git init
          git checkout -b chinese-build
          git add .
          git commit -m "🤖 CI sync upstream + local dict + LibreTranslate auto translate" || git commit --allow-empty -m "🤖 CI run, no file changes"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin chinese-build

      - name: 上传输出产物包（包含翻译后文件+miss日志）
        uses: actions/upload-artifact@v4
        with:
          name: translated-cheats-output
          path: work_out/
