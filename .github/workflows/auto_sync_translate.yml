name: 同步上游翻译｜新词自动扩充词典回写master
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json5 deepl
        shell: bash

      - name: Git bot identity config
        run: |
          git config --global user.name "Cheat-Translate-Bot"
          git config --global user.email "bot@example.com"
        shell: bash

      - name: Clone upstream TeeKay87/HEN-Cheats-Collection
        run: |
          rm -rf upstream_src
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_src
        shell: bash

      - name: Prepare work directory
        run: |
          rm -rf work_out
          mkdir work_out
          cp -r ./upstream_src/* ./work_out/
          cp ./auto_translate_cheat.py ./work_out/
          mkdir -p ./work_out/conf
          cp ./custom_dict.json ./work_out/conf/custom_dict.json
        shell: bash

      - name: Run translate script
        timeout-minutes: 18
        env:
          DICT_PATH: "./conf/custom_dict.json"
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          cd work_out
          python auto_translate_cheat.py 2>&1
          echo "Translate job finished, exit code: $?"
        shell: bash

      - name: Commit & push chinese‑build branch
        run: |
          cd ./work_out
          git init
          git checkout -b chinese-build
          git add .
          git commit -m "🤖 CI sync upstream + local dict + DeepL auto‑expand dict" || git commit --allow-empty -m "🤖 CI run, no file changes"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin chinese-build
        shell: bash

      - name: Upload translated zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: translated-cheats-output
          path: work_out/

      - name: Compute release tag date
        run: |
          set -e
          TODAY=$(date "+%d")
          EVENT=${{ github.event_name }}
          if [[ "$EVENT" == "schedule" && "$TODAY" != "01" ]]; then
            echo "SKIP_RELEASE=1" >> $GITHUB_ENV
          else
            echo "SKIP_RELEASE=0" >> $GITHUB_ENV
            echo "RELEASE_TAG=cheats-$(date "+%Y%m%d-%H-%M")" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Auto Translated Cheats $(date "+%Y-%m-%d %H-%M")" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build zip & create GitHub Release
        if: env.SKIP_RELEASE == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_TITLE: ${{ env.RELEASE_TITLE }}
        run: |
          set -e
          cd work_out
          cp ../README.md ./
          zip -r ../translated-cheats-${RELEASE_TAG}.zip \
            README.md shn json mc4 \
            -x "*.git*" "*.py" "conf/*" "*.log"
          cd ..
          gh release create "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes "Auto synced & translated cheats from upstream. JSON:auto‑translate+expand dict, SHN:local‑dict safe mode. Generated by CI bot." translated-cheats-${RELEASE_TAG}.zip
        shell: bash

      - name: Save expanded dict to temp dir before checkout
        run: |
          mkdir -p /tmp/auto_dict_temp
          cp ./work_out/conf/custom_dict.json /tmp/auto_dict_temp/custom_dict.json
          echo "[INFO] Dictionary saved to temp"
        shell: bash

      - name: Checkout master for dict commit
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Copy updated dict back to master workspace
        run: |
          cp /tmp/auto_dict_temp/custom_dict.json ./custom_dict.json
          git add ./custom_dict.json
        shell: bash

      - name: Commit updated custom_dict.json back to master
        run: |
          if git diff --cached --quiet; then
            echo "[INFO] No new dict entries, skip commit"
          else
            git commit -m "🤖 Bot: auto expand custom_dict.json from DeepL translate result"
            git push origin master
            echo "[INFO] Dictionary pushed to master"
          fi
        shell: bash
