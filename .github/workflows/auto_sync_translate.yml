name: 同步上游并翻译 -> chinese-build
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json5

      - name: Git bot identity config
        run: |
          git config --global user.name "Cheat-Translate-Bot"
          git config --global user.email "bot@example.org"

      - name: Clone upstream TeeKay87/HEN-Cheats-Collection
        run: |
          rm -rf upstream_src
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_src

      - name: Prepare chinese‑build work folder
        run: |
          rm -rf work_out
          mkdir work_out
          cp -r ./upstream_src/* ./work_out/
          cp ./auto_translate_cheat.py ./work_out/
          cp ./custom_dict.json ./work_out/

      # 关键：即使翻译脚本返回非0错误码，也不终止工作流，继续往下执行推送
      - name: Run translate script
        continue-on-error: true
        run: |
          cd ./work_out
          python auto_translate_cheat.py 2>&1
          echo "Translate finished, exit code: $?"

      # 强制提交，不管翻译脚本是否报错，尽量生成chinese‑build分支
      - name: Commit & push to chinese‑build
        run: |
          cd ./work_out
          git init
          git checkout -b chinese-build
          git add .
          git commit -m "🤖 CI: sync upstream + offline translate cheats" || git commit --allow-empty -m "🤖 CI run, no changes"
          git remote add origin https://github.com/${{ github.repository }}.git
          git push --force origin chinese-build
