name: Sync Upstream & Translate → chinese‑build
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout fork repo (main branch)
        uses: actions/checkout@v4
        with:
          fetch‑depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup‑python@v5
        with:
          python‑version: "3.11"

      - name: Install python deps
        run: |
          python ‑m pip install --upgrade pip
          pip install pyglossary json5

      - name: Download offline Stardict EC dictionary
        run: |
          mkdir ‑p dict
          cd dict
          wget ‑q https://github.com/zhelihu/stardict‑ec/raw/main/stardict‑ec‑2.4.2.tar.gz
          tar ‑xf stardict‑ec‑2.4.2.tar.gz

      - name: Git bot config
        run: |
          git config --global user.name "Cheat‑Translate‑Bot"
          git config --global user.email "bot@example.org"

      - name: Add upstream remote (read‑only)
        run: |
          git remote add upstream https://github.com/TeeKay87/HEN-Cheats-Collection.git
          git fetch upstream

      - name: Prepare chinese‑build branch
        run: |
          git checkout‑B chinese‑build origin/chinese‑build || git checkout ‑B chinese‑build
          git merge upstream/main --no-edit

      - name: Run offline translate script
        run: python auto_translate_cheat.py

      - name: Commit & push to chinese‑build (only your fork origin)
        run: |
          git add .
          git commit ‑m "🤖 CI: sync upstream + offline translate cheats" || echo "ℹ️ No file changes, skip commit"
          git push origin chinese‑build
