name: Sync upstream & Auto Translate Cheats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      create_manual_release:
        description: "手动运行时，是否生成Release发布包"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deepl
          pip install gh

      - name: Configure git bot identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone upstream source repo
        run: |
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_repo

      - name: Prepare work directory
        run: |
          rm -rf work_out
          mkdir -p work_out
          if [ -f ./file_state.json ]; then cp ./file_state.json work_out/; fi
          if [ -f ./custom_dict.json ]; then cp ./custom_dict.json work_out/; fi

      - name: Run translation script
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          cp -r ./upstream_repo/cheats/* ./work_out/
          cd work_out
          cp ../auto_translate_cheat.py ./
          cp ../ps4_ps5_mc4_tool.py ./
          python3 auto_translate_cheat.py
          # 控制台打印miss日志，方便直接看CI运行结果
          if [ -f translate_miss.log ]; then
            echo "================ translate_miss.log ================"
            cat translate_miss.log
          fi

      - name: Commit and push chinese-build branch
        run: |
          git checkout -B chinese-build
          rm -rf cheats
          mv work_out/* ./
          git add cheats custom_dict.json
          [ -f file_state.json ] && git add file_state.json
          # -f强制add日志文件，规避*.log gitignore通配符拦截
          [ -f translate_miss.log ] && git add -f translate_miss.log
          git commit -m "Auto sync & translate $(date '+%Y-%m-%d %H:%M')" || echo "Nothing changed, skip commit"
          git push -f origin chinese-build

      - name: Checkout chinese‑build for package
        uses: actions/checkout@v4
        with:
          ref: chinese-build
          fetch-depth: 1
          path: build_pkg

      - name: Fetch README.md from master
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
          path: build_pkg

      - name: Build zip archive
        run: |
          cd build_pkg
          zip -r ../CN-Cheats-Collection.zip README.md cheats/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cn-cheats-package
          path: CN-Cheats-Collection.zip

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(date +%d)
          MANUAL_RELEASE=${{ github.event.inputs.create_manual_release }}
          DO_RELEASE=0

          if [[ "${{ github.event_name }}" == "schedule" && "$DAY" == "01" ]]; then
            DO_RELEASE=1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MANUAL_RELEASE" == "true" ]]; then
            DO_RELEASE=1
          fi

          if [ "$DO_RELEASE" -eq 1 ]; then
            TAG="v$(date +%Y-%m-%d)"
            gh release create "$TAG" \
              --title "CN‑Cheats‑Collection $TAG" \
              --notes "Auto‑translated cheats from chinese‑build branch" \
              ./CN-Cheats-Collection.zip
            echo "✅ Release created $TAG"
          else
            echo "⏭ 不执行Release发布"
          fi
