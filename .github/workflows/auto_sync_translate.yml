name: Sync upstream & Auto Translate Cheats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deepl
          pip install gh

      - name: Configure git bot identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone upstream source repo
        run: |
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_repo

      - name: Prepare work directory
        run: |
          rm -rf work_out
          mkdir -p work_out
          # 文件存在才复制，首次运行无状态文件不会报错
          if [ -f ./file_state.json ]; then cp ./file_state.json work_out/; fi
          if [ -f ./custom_dict.json ]; then cp ./custom_dict.json work_out/; fi

      - name: Run translation script
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          cp -r ./upstream_repo/cheats/* ./work_out/
          cd work_out
          cp ../auto_translate_cheat.py ./
          python3 auto_translate_cheat.py

      - name: Commit and push chinese-build branch
        run: |
          git checkout -B chinese-build
          rm -rf cheats
          mv work_out/* ./
          git add cheats custom_dict.json file_state.json translate_miss.log
          git commit -m "Auto sync & translate $(date '+%Y-%m-%d %H:%M')" || echo "Nothing changed, skip commit"
          git push -f origin chinese-build

      - name: Checkout chinese‑build for package
        uses: actions/checkout@v4
        with:
          ref: chinese-build
          fetch-depth: 1
          path: build_pkg

      - name: Fetch README.md from master
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
          path: build_pkg

      - name: Build zip archive
        run: |
          cd build_pkg
          zip -r ../CN-Cheats-Collection.zip README.md cheats/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cn-cheats-package
          path: CN-Cheats-Collection.zip

      - name: Monthly Release (Only schedule run on day‑01)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(date +%d)
          if [ "$DAY" = "01" ]; then
            TAG="v$(date +%Y-%m-01)"
            gh release create "$TAG" \
              --title "CN‑Cheats‑Collection Monthly $(date +%Y‑%m)" \
              --notes "Auto‑translated cheats from chinese‑build branch" \
              ./CN-Cheats-Collection.zip
          else
            echo "Not month first day, skip release creation."
          fi
