name: 同步上游并翻译 -> chinese-build
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    steps:
      # 1、检出你自己仓库main分支（翻译脚本、custom_dict.json）
      - name: Checkout my repo main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json5

      - name: Git bot identity config
        run: |
          git config --global user.name "Cheat-Translate-Bot"
          git config --global user.email "bot@example.org"

      # 2、单独克隆上游仓库到子目录 upstream_src，完全绕开remote upstream问题
      - name: Clone upstream TeeKay87/HEN-Cheats-Collection
        run: |
          rm -rf upstream_src
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_src

      # 3、准备 chinese‑build 工作目录：把上游全部文件复制出来
      - name: Prepare chinese‑build work folder
        run: |
          rm -rf work_out
          mkdir work_out
          cp -r ./upstream_src/* ./work_out/
          # 复制翻译脚本和词典进入输出目录
          cp ./auto_translate_cheat.py ./work_out/
          cp ./custom_dict.json ./work_out/

      # 4、进入工作目录执行翻译脚本
      - name: Run translate script
        run: |
          cd ./work_out
          python auto_translate_cheat.py

      # 5、初始化git，推送至 chinese‑build 分支，force强制覆盖远端
      - name: Commit & push to chinese‑build
        run: |
          cd ./work_out
          git init
          git checkout -b chinese-build
          git add .
          git commit -m "🤖 CI: sync upstream + offline translate cheats"
          git remote add origin https://github.com/${{ github.repository }}.git
          git push --force origin chinese-build
