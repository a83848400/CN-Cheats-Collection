name: Sync upstream & Auto Translate Cheats
on:
  schedule:
    - cron: "0 0 * * *"   # 每日凌晨0点 UTC，执行同步翻译
  workflow_dispatch:      # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync_and_build_cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install deepl

      - name: Git bot identity config
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"

      - name: Clone upstream TeeKay87/HEN‑Cheats‑Collection
        run: |
          git clone --depth 1 https://github.com/TeeKay87/HEN-Cheats-Collection.git upstream_repo

      - name: Prepare work directory
        run: |
          rm -rf work_out
          mkdir -p work_out
          # 文件存在才复制，首次运行没有file_state.json不会报错
          if [ -f ./file_state.json ]; then cp ./file_state.json work_out/; fi
          if [ -f ./custom_dict.json ]; then cp ./custom_dict.json work_out/; fi

      - name: Run translate script
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DICT_PATH: custom_dict.json
        run: |
          cp -r ./upstream_repo/cheats/* ./work_out/
          cd work_out
          cp ../auto_translate_cheat.py ./
          python3 auto_translate_cheat.py

      - name: Commit & push chinese‑build branch
        run: |
          git checkout -B chinese-build
          rm -rf cheats
          mv work_out/* ./
          git add cheats custom_dict.json file_state.json translate_miss.log
          git commit -m "Auto sync & translate $(date '+%Y‑%m‑%d %H:%M')" || echo "nothing to commit"
          git push -f origin chinese-build

      - name: Checkout chinese‑build for release package
        uses: actions/checkout@v4
        with:
          ref: chinese-build
          fetch-depth: 1
          path: build_package

      - name: Checkout master readme
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
          path: build_package

      - name: Make zip artifact
        run: |
          cd build_package
          zip -r ../CN‑Cheats‑Collection‑CN.zip README.md cheats/

      - name: Upload translated zip artifact
        uses: actions/upload‑artifact@v4
        with:
          name: cn‑cheats‑zip
          path: CN‑Cheats‑Collection‑CN.zip

      - name: Create Monthly Release (only run on day 1 every month)
        if: github.event_name == 'schedule' && github.run_number != 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%d)
          if [ "$TODAY" = "01" ]; then
            echo "Monthly release triggered, creating release"
            gh release create "v$(date +%Y‑%m‑01)" \
              --title "CN‑Cheats‑Collection Monthly $(date +%Y‑%m)" \
              --notes "Auto‑translated cheats from chinese‑build branch" \
              ../CN‑Cheats‑Collection‑CN.zip
          else
            echo "Not 1st day of month, skip creating release"
          fi
